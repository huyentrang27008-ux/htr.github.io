<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ứng tuyển: Lập trình viên Front-End</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 25px 30px;
            border: 1px solid #ddd;
            border-radius: 10px;      
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
            color: #222;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 8px;       
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #333;
            padding: 0 6px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
            color: #333;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;        
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #3b82f6;     
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;       
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Ứng tuyển: Lập trình viên Front-End</h1>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <fieldset>
                <legend>Thông tin cá nhân</legend>
                
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone">
            </fieldset>

            <fieldset>
                <legend>Nội dung ứng tuyển</legend>

                <label for="coverletter">Thư giới thiệu bản thân</label>
                <textarea id="coverletter" name="coverletter" rows="5" placeholder="Tại sao bạn là ứng viên phù hợp cho vị trí này?"></textarea>

                <label for="cv">Tải lên CV/Resume</label>
                <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx">
            </fieldset>

            <button type="submit">Gửi đơn ứng tuyển</button>
        </form>
    </div>
</body>
</html>
